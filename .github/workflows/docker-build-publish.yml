name: Docker Build and Publish

on:
  workflow_dispatch:
  push:
    tags:
      - '26.0.0.821'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download official command-line tools
        env:
          CLT_URL: ${{ secrets.HARMONY_CLT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLT_URL" ]; then
            echo '::error::Set HARMONY_CLT_URL to the download URL for the official Linux 26.0.0.821 archive.'
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 3 \
            --output commandline-tools-linux-x64-26.0.0.821.zip "$CLT_URL"
          echo '58da7359019e9360a8bb82da0cd1d3b3b26fedc338379f257849f2162e3ac1fc  commandline-tools-linux-x64-26.0.0.821.zip' | sha256sum -c -
      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/harmonyos-ci-image:26.0.0.821"
          docker build --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" -t "$image" .
          docker run --rm "$image" bash -c 'node --version && java -version && ohpm --version'
          echo "HARMONY_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Publish image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$HARMONY_IMAGE"
